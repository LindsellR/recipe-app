{% extends "base.html" %}
{% load static %}

{% block content %}
<h2>My Favourites</h2>

<div class="card-container">
    {% for fav in favourites %}
    <div class="recipe-card">
        {% include "recipes/recipe_card.html" with recipe=fav.recipe %}

    </div>
    {% empty %}
    <p>You have no favourite recipes yet.</p>
    {% endfor %}
</div>
{% endblock %}
